const ITER = 600000;
async function decryptPage(pw) {
  const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(plain);
}
async function show(pw) {
  const html = await decryptPage(pw);
  sessionStorage.setItem("hw-pw", pw);  // évite de redemander au rechargement automatique ; effacé à la fermeture de l'onglet
  document.open(); document.write(html); document.close();
}
const saved = sessionStorage.getItem("hw-pw");
if (saved) show(saved).catch(() => sessionStorage.removeItem("hw-pw"));
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "Déchiffrement…";
  try { await show(document.getElementById("pw").value); }
  catch { err.textContent = "Mot de passe incorrect."; }
});
